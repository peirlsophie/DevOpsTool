name: DevOps Learning Hub CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: DevOpsEduDb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Static Code Analysis (Linting)
      run: dotnet format --verify-no-changes --verbosity normal
        
    - name: Restore Dependencies
      run: dotnet restore

    - name: Static Code Analysis (Build)
      run: dotnet build --no-restore --configuration Release

    - name: Run Automated Tests
      run: dotnet test --no-build --configuration Release --verbosity normal
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=DevOpsEduDb;Username=postgres;Password=postgres"
